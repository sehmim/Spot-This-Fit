services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: spotthisfit-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: spotthisfit
      POSTGRES_PASSWORD: spotthisfit
      POSTGRES_DB: spotthisfit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotthisfit"]
      interval: 5s
      timeout: 3s
      retries: 5

  clip-service:
    build: ./clip-service
    container_name: spotthisfit-clip
    restart: unless-stopped
    ports:
      - "5111:5111"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5111/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
