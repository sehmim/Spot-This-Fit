services:
  postgres:
    image: postgres:16-alpine
    container_name: spotthisfit-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: spotthisfit
      POSTGRES_PASSWORD: spotthisfit
      POSTGRES_DB: spotthisfit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotthisfit"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
