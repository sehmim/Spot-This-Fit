name = "spotthisfit-webhook"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
VERIFY_TOKEN = "SPOT_THIS_META_WEBHOOK_TOKEN_420_69"

# APP_SECRET should be set as a secret, not a var:
#   wrangler secret put APP_SECRET

# Rate limiting KV store
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "20327327b4844139a6b8cd4ad22a03d5"

# Shared D1 database for conversation history and analysis jobs
[[d1_databases]]
binding = "CONVERSATIONS_DB"
database_name = "vertorize-img-db"
database_id = "5df0aff4-d62f-48de-a762-6320024fcc54"

# Queue for async processing of reels (screenshot + vectorize)
[[queues.producers]]
queue = "spotthisfit-processing"
binding = "PROCESSING_QUEUE"

[[queues.consumers]]
queue = "spotthisfit-processing"
max_batch_size = 1
max_retries = 2
max_batch_timeout = 0
